<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Halloween Living Desktop</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05020d;
    }

    body {
      display: grid;
      place-items: center;
    }

    #scene {
      position: relative;
      width: min(100vw, calc(100vh * 3.2));
      height: min(100vh, calc(100vw / 3.2));
      overflow: hidden;
      isolation: isolate;
      background: #100724;
      cursor: none;
    }

    #artwork, #glow, #effects, #shade {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #artwork {
      object-fit: cover;
      user-select: none;
    }

    #glow { mix-blend-mode: screen; }

    #shade {
      background:
        radial-gradient(ellipse at 52% 42%, transparent 48%, rgba(5, 1, 14, 0.25) 100%),
        linear-gradient(to bottom, rgba(4, 1, 14, 0.06), transparent 30%, transparent 80%, rgba(4, 1, 14, 0.18));
    }
  </style>
</head>
<body>
  <main id="scene" aria-label="万圣节动态场景：月光、南瓜灯、薄雾与飞舞的蝙蝠">
    <img
      id="artwork"
      src="./Gemini_Generated_Image_1mok6v1mok6v1mok.jfif"
      width="1856"
      height="576"
      draggable="false"
      fetchpriority="high"
      alt="月光下的万圣节古堡与南瓜灯"
    >
    <canvas id="glow" width="1280" height="400"></canvas>
    <canvas id="effects" width="1280" height="400"></canvas>
    <div id="shade"></div>
  </main>

  <script>
    (() => {
      'use strict';

      const WIDTH = 1280;
      const HEIGHT = 400;
      const TAU = Math.PI * 2;
      const glowCanvas = document.getElementById('glow');
      const effectsCanvas = document.getElementById('effects');
      const glowContext = glowCanvas.getContext('2d');
      const context = effectsCanvas.getContext('2d');

      let seed = 0x31f2a9c7;
      function random() {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 4294967296;
      }

      function drawGlow(x, y, radius, verticalRadius, color, strength) {
        glowContext.save();
        glowContext.translate(x, y);
        glowContext.scale(1, verticalRadius / radius);
        const gradient = glowContext.createRadialGradient(0, 0, 0, 0, 0, radius);
        gradient.addColorStop(0, `rgba(${color}, ${strength})`);
        gradient.addColorStop(0.28, `rgba(${color}, ${strength * 0.65})`);
        gradient.addColorStop(0.65, `rgba(${color}, ${strength * 0.18})`);
        gradient.addColorStop(1, `rgba(${color}, 0)`);
        glowContext.fillStyle = gradient;
        glowContext.fillRect(-radius, -radius, radius * 2, radius * 2);
        glowContext.restore();
      }

      const pumpkinLights = [
        { x: 264, y: 329, radius: 88, verticalRadius: 72, phase: 0.4 },
        { x: 332, y: 278, radius: 51, verticalRadius: 48, phase: 2.7 },
        { x: 416, y: 334, radius: 112, verticalRadius: 88, phase: 4.1 },
        { x: 584, y: 350, radius: 57, verticalRadius: 46, phase: 1.6 },
        { x: 1034, y: 315, radius: 84, verticalRadius: 77, phase: 5.3 },
        { x: 1109, y: 283, radius: 58, verticalRadius: 50, phase: 3.4 },
        { x: 1095, y: 354, radius: 66, verticalRadius: 51, phase: 0.9 }
      ];

      const fogSprite = document.createElement('canvas');
      fogSprite.width = 320;
      fogSprite.height = 100;
      const fogContext = fogSprite.getContext('2d');
      for (let index = 0; index < 12; index += 1) {
        const x = 35 + random() * 250;
        const y = 30 + random() * 40;
        const radius = 35 + random() * 55;
        const gradient = fogContext.createRadialGradient(x, y, 0, x, y, radius);
        gradient.addColorStop(0, 'rgba(181, 157, 214, 0.16)');
        gradient.addColorStop(0.45, 'rgba(139, 116, 181, 0.08)');
        gradient.addColorStop(1, 'rgba(104, 83, 151, 0)');
        fogContext.fillStyle = gradient;
        fogContext.fillRect(0, 0, fogSprite.width, fogSprite.height);
      }

      const fogWisps = Array.from({ length: 10 }, () => ({
        start: random() * (WIDTH + 700),
        y: 255 + random() * 118,
        width: 190 + random() * 250,
        height: 35 + random() * 48,
        speed: (4 + random() * 8) * (random() > 0.35 ? 1 : -1),
        alpha: 0.35 + random() * 0.25,
        phase: random() * TAU
      }));

      const emberSources = [
        { x: 264, y: 350, spread: 80 },
        { x: 416, y: 358, spread: 105 },
        { x: 584, y: 363, spread: 45 },
        { x: 1034, y: 342, spread: 70 },
        { x: 1095, y: 369, spread: 55 }
      ];

      const embers = Array.from({ length: 28 }, (_, index) => ({
        source: emberSources[index % emberSources.length],
        offset: random() - 0.5,
        phase: random(),
        sway: random() * TAU,
        speed: 0.055 + random() * 0.055,
        rise: 28 + random() * 42,
        size: 0.55 + random() * 0.95
      }));

      const bats = [
        { offset: 0.42, duration: 29, y: 122, amplitude: 14, scale: 0.58, phase: 0.7 },
        { offset: 0.70, duration: 37, y: 183, amplitude: 10, scale: 0.42, phase: 2.1 },
        { offset: 0.10, duration: 33, y: 72, amplitude: 18, scale: 0.36, phase: 4.4 }
      ];

      function drawFog(time) {
        for (const wisp of fogWisps) {
          const travel = WIDTH + wisp.width * 2;
          const raw = wisp.start + time * wisp.speed;
          const x = ((raw % travel) + travel) % travel - wisp.width;
          const y = wisp.y + Math.sin(time * 0.18 + wisp.phase) * 8;
          context.globalAlpha = wisp.alpha * (0.85 + Math.sin(time * 0.23 + wisp.phase) * 0.15);
          context.drawImage(fogSprite, x, y, wisp.width, wisp.height);
        }
        context.globalAlpha = 1;
      }

      function drawEmbers(time) {
        for (const ember of embers) {
          const life = (time * ember.speed + ember.phase) % 1;
          const alpha = Math.sin(life * Math.PI) * 0.62;
          const x = ember.source.x + ember.offset * ember.source.spread
            + Math.sin(time * 0.9 + ember.sway) * 9 * life;
          const y = ember.source.y - life * ember.rise;
          const radius = ember.size * (1 - life * 0.45);
          context.fillStyle = `rgba(255, 164, 65, ${alpha})`;
          context.beginPath();
          context.arc(x, y, radius, 0, TAU);
          context.fill();
        }
      }

      function drawBat(bat, time) {
        const progress = (time / bat.duration + bat.offset) % 1;
        const x = -90 + progress * (WIDTH + 180);
        const y = bat.y + Math.sin(progress * TAU * 2 + bat.phase) * bat.amplitude;
        const flap = Math.sin(time * 8.5 + bat.phase) * 5;

        context.save();
        context.translate(x, y);
        context.scale(bat.scale, bat.scale);
        context.fillStyle = 'rgba(12, 7, 25, 0.96)';
        context.beginPath();
        context.moveTo(0, 5);
        context.bezierCurveTo(-6, 0, -9, -4, -14, -3);
        context.bezierCurveTo(-21, -12 - flap, -31, -13 - flap, -40, -8 - flap);
        context.bezierCurveTo(-34, -2 - flap * 0.4, -31, 4, -24, 6);
        context.lineTo(-28, 12);
        context.quadraticCurveTo(-18, 8, -10, 12);
        context.quadraticCurveTo(-5, 7, 0, 10);
        context.quadraticCurveTo(5, 7, 10, 12);
        context.quadraticCurveTo(18, 8, 28, 12);
        context.lineTo(24, 6);
        context.bezierCurveTo(31, 4, 34, -2 - flap * 0.4, 40, -8 - flap);
        context.bezierCurveTo(31, -13 - flap, 21, -12 - flap, 14, -3);
        context.bezierCurveTo(9, -4, 6, 0, 0, 5);
        context.fill();

        context.beginPath();
        context.ellipse(0, 4, 3.4, 8, 0, 0, TAU);
        context.moveTo(-3, -3);
        context.lineTo(-2, -9);
        context.lineTo(0, -5);
        context.lineTo(2, -9);
        context.lineTo(3, -3);
        context.closePath();
        context.fill();
        context.restore();
      }

      function render(time) {
        glowContext.clearRect(0, 0, WIDTH, HEIGHT);
        context.clearRect(0, 0, WIDTH, HEIGHT);

        const moonBreath = 0.045 + (Math.sin(time * 0.42) + 1) * 0.012;
        drawGlow(660, 180, 190, 184, '255, 143, 94', moonBreath);
        drawGlow(761, 254, 58, 79, '255, 153, 47', 0.065 + Math.sin(time * 1.7) * 0.012);

        pumpkinLights.forEach((light, index) => {
          const flicker = 0.72
            + Math.sin(time * (2.1 + index * 0.17) + light.phase) * 0.14
            + Math.sin(time * (7.3 + index * 0.11) + light.phase * 2) * 0.08
            + Math.sin(time * 13.1 + light.phase) * 0.06;
          drawGlow(
            light.x,
            light.y,
            light.radius,
            light.verticalRadius,
            '255, 119, 28',
            0.045 + flicker * 0.095
          );
        });

        drawFog(time);
        drawEmbers(time);
        for (const bat of bats) drawBat(bat, time);
      }

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let paused = reducedMotion.matches;
      let time = 0;
      let previous = performance.now();
      let previousPaint = 0;

      function frame(now) {
        const elapsed = Math.min((now - previous) / 1000, 0.05);
        previous = now;
        if (!paused && !document.hidden) {
          time += elapsed;
          if (now - previousPaint >= 1000 / 30) {
            render(time);
            previousPaint = now;
          }
        }
        requestAnimationFrame(frame);
      }

      document.addEventListener('keydown', (event) => {
        if (event.code === 'Space') {
          event.preventDefault();
          paused = !paused;
        } else if (event.code === 'KeyF') {
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else {
            document.documentElement.requestFullscreen();
          }
        }
      });

      reducedMotion.addEventListener('change', (event) => {
        paused = event.matches;
      });

      render(0);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
